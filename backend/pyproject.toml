[project]
name = "videokit"
# The git tag is the version (docs/RELEASING.md); the build backend requires this field.
version = "0.0.0"
description = "Self-hosted web app hosting video tools."
authors = [{ name = "Anton Krivenko" }]
requires-python = ">=3.14"
dependencies = [
    # Every third-party module src/ imports is declared here, even when another dependency brings it
    # in today (tests/unit/test_dependencies.py): httpx left the image with google-genai 3.0.
    "fastapi",
    "starlette",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "openai",
    # HEIC decoding behind MediaService.normalize_picture (tiled phone photos); specs/004-video-generation/research.md V7.
    "pillow-heif>=1.8.1",
    "pillow",
    # Gemini Omni video generation (Interactions API); >=2.28 is the first release that knows the model.
    # No extras: `local-tokenizer` pulls in torch. specs/004-video-generation/research.md V2.
    "google-genai>=3.0.0",
    # FastAPI's form parser for the multipart picture upload; specs/004-video-generation/research.md V14.
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyyaml",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videokit"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src/videokit", "tests", "../scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests that call real providers (need API keys/network)"]
addopts = "-m 'not live' --cov=videokit --cov-report=term-missing"

[tool.coverage.run]
source = ["videokit"]
branch = true

[tool.coverage.report]
fail_under = 80
