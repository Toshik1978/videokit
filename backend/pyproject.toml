[project]
name = "videokit"
# The git tag is the version (docs/RELEASING.md); the build backend requires this field.
version = "0.0.0"
description = "Self-hosted web app hosting video tools."
authors = [{ name = "Anton Krivenko" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "openai",
    "faster-whisper",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which av 19 rejects; lift when it supports av 19.
    "av<19",
    # GPU matrix math for ctranslate2 (CUDA 12); the only GPU library it loads — see
    # specs/002-packaging-releases/research.md R2.
    "nvidia-cublas-cu12",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pyyaml",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videokit"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src/videokit", "tests", "../scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests that call real providers (need API keys/network)"]
addopts = "-m 'not live' --cov=videokit --cov-report=term-missing"

[tool.coverage.run]
source = ["videokit"]
branch = true

[tool.coverage.report]
fail_under = 80
