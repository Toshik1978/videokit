name: Commit messages

# Conventional Commits, checked on every commit that reaches `main` and every commit in a pull
# request, so a contributor who never ran `pre-commit install` is still caught before merge.
#
# The check runs the repo's own commit-msg hook (see the script) rather than a third-party action:
# the rule then has one definition instead of two that can drift.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script walks a commit range, so it needs the ancestors.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pipx install pre-commit

      # The hook's own environment, keyed by the config that pins its rev.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-commit-msg-${{ hashFiles('.pre-commit-config.yaml') }}

      # On a PR the range is the PR's own commits; on a push to main, whatever the push added.
      # `before` is all zeros for a branch's first push, which the script handles.
      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD_SHA"
