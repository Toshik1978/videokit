# Example deployment. Copy .env.example to .env and fill in your keys first.
services:
  videokit:
    build: .
    image: videokit:latest
    env_file: .env
    ports:
      - "8000:8000"
    # Runtime data (SQLite DB, jobs, model caches) lives in the gitignored ./.data directory.
    volumes:
      - ./.data:/data
    # Run as the host user so the bind-mounted ./.data is writable. bash does not export UID, so
    # pass it explicitly if your user is not 1000:
    #   UID=$(id -u) GID=$(id -g) docker compose up -d --build
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    # Optional GPU for local transcription (needs the NVIDIA Container Toolkit on the host).
    # Leave commented out on CPU-only hosts.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
