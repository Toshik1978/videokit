# Example deployment. Copy .env.example to .env and fill in your keys first.
services:
  videokit:
    image: ghcr.io/toshik1978/videokit:latest
    env_file: .env
    ports:
      - "8000:8000"
    # Runtime data (SQLite DB, jobs, model caches) lives in the gitignored ./.data directory.
    volumes:
      - ./.data:/data
    # Run as the host user so the bind-mounted ./.data is writable. Set PUID/PGID in .env to the
    # output of `id -u` / `id -g` if your user is not 1000 (UID is readonly in bash, so not used).
    # Create ./.data first (`mkdir -p .data`); otherwise Docker creates it as root.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
